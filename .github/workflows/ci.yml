name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: bash scripts/build.sh
      - name: Test with DSP sanitizers
        run: SANITIZE=1 bash scripts/test.sh
      - name: Verify app metadata and signature
        run: |
          plutil -lint Info.plist Eqmini.entitlements
          codesign --verify --deep --strict build/eqmini.app
